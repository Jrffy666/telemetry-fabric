syntax = "proto3";

package telemetry.fabric.agent.v1;

service AgentControl {
  rpc RegisterAgent(RegisterAgentRequest) returns (RegisterAgentResponse);
  rpc StreamConfig(ConfigStreamRequest) returns (stream ConfigUpdate);
  rpc Heartbeat(stream AgentHeartbeat) returns (stream ControlCommand);
  rpc ReportStatus(AgentStatusRequest) returns (AgentStatusResponse);
}

message RegisterAgentRequest {
  string agent_id = 1;
  string tenant_id = 2;
  string hostname = 3;
  string version = 4;
  map<string, string> labels = 5;
}

message RegisterAgentResponse {
  bool accepted = 1;
  uint64 config_version = 2;
  string message = 3;
}

message ConfigStreamRequest {
  string agent_id = 1;
  string tenant_id = 2;
  uint64 current_version = 3;
}

message ConfigUpdate {
  uint64 version = 1;
  bytes pipeline_config = 2;
  string checksum = 3;
}

message AgentHeartbeat {
  string agent_id = 1;
  string tenant_id = 2;
  uint64 config_version = 3;
  uint64 queue_depth_bytes = 4;
  uint64 ingest_bytes_per_second = 5;
}

message ControlCommand {
  string command_id = 1;
  ControlCommandKind kind = 2;
  string reason = 3;
}

enum ControlCommandKind {
  CONTROL_COMMAND_KIND_UNSPECIFIED = 0;
  CONTROL_COMMAND_KIND_RELOAD_CONFIG = 1;
  CONTROL_COMMAND_KIND_DRAIN_AND_RESTART = 2;
  CONTROL_COMMAND_KIND_PAUSE_EXPORTS = 3;
  CONTROL_COMMAND_KIND_RESUME_EXPORTS = 4;
}

message AgentStatusRequest {
  string agent_id = 1;
  string tenant_id = 2;
}

message AgentStatusResponse {
  string agent_id = 1;
  bool healthy = 2;
  uint64 config_version = 3;
  repeated string warnings = 4;
}
