syntax = "proto3";

package telemetry.fabric.config.v1;

message PipelineConfig {
  string tenant_id = 1;
  string name = 2;
  repeated Receiver receivers = 3;
  repeated Processor processors = 4;
  repeated Exporter exporters = 5;
  repeated Route routes = 6;
  TenantLimits limits = 7;
}

message Receiver {
  string name = 1;
  ReceiverProtocol protocol = 2;
  string endpoint = 3;
}

enum ReceiverProtocol {
  RECEIVER_PROTOCOL_UNSPECIFIED = 0;
  RECEIVER_PROTOCOL_OTLP_GRPC = 1;
  RECEIVER_PROTOCOL_OTLP_HTTP = 2;
  RECEIVER_PROTOCOL_PROMETHEUS_REMOTE_WRITE = 3;
  RECEIVER_PROTOCOL_FILE_LOG = 4;
  RECEIVER_PROTOCOL_TF_LINE = 5;
}

message Processor {
  string name = 1;
  ProcessorKind kind = 2;
  bool enabled = 3;
}

enum ProcessorKind {
  PROCESSOR_KIND_UNSPECIFIED = 0;
  PROCESSOR_KIND_MEMORY_LIMITER = 1;
  PROCESSOR_KIND_BATCH = 2;
  PROCESSOR_KIND_REDACT = 3;
  PROCESSOR_KIND_TAIL_SAMPLING = 4;
  PROCESSOR_KIND_TENANT_RATE_LIMIT = 5;
}

message Exporter {
  string name = 1;
  ExporterProtocol protocol = 2;
  string endpoint = 3;
  bool tls = 4;
}

enum ExporterProtocol {
  EXPORTER_PROTOCOL_UNSPECIFIED = 0;
  EXPORTER_PROTOCOL_OTLP_GRPC = 1;
  EXPORTER_PROTOCOL_OTLP_HTTP = 2;
  EXPORTER_PROTOCOL_PROMETHEUS_REMOTE_WRITE = 3;
  EXPORTER_PROTOCOL_KAFKA = 4;
  EXPORTER_PROTOCOL_S3 = 5;
  EXPORTER_PROTOCOL_STDOUT = 6;
  EXPORTER_PROTOCOL_FILE = 7;
}

message Route {
  SignalKind signal = 1;
  repeated string exporters = 2;
}

enum SignalKind {
  SIGNAL_KIND_UNSPECIFIED = 0;
  SIGNAL_KIND_TRACE = 1;
  SIGNAL_KIND_METRIC = 2;
  SIGNAL_KIND_LOG = 3;
}

message TenantLimits {
  uint64 max_ingest_bytes_per_second = 1;
  uint64 max_queue_bytes = 2;
  uint32 max_record_bytes = 3;
}
