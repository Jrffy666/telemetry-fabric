version: 1
owner: storage/kafka
description: Kafka topic contracts for blockchain event streams.

defaults:
  replication_factor: 3
  min_insync_replicas: 2
  cleanup_policy: delete
  compression_type: zstd
  message_format: protobuf
  envelope_schema: contracts/proto/platform/envelope.proto
  schema_compatibility: backward
  partition_count: 24
  max_message_bytes: 1048576
  producer_required_headers:
    - tenant_id
    - schema_version
    - event_type
    - trace_id
  replay:
    supported: true
    source_of_truth: chain.events.raw
    checkpoint: platform.Checkpoint

partition_key_strategies:
  chain_block:
    expression: "{chain}:{network}:{block_number}"
    purpose: Preserves block-oriented locality for ordered block processing.
  address:
    expression: "{chain}:{network}:{address}"
    purpose: Groups wallet or contract activity for address analytics.
  priority:
    expression: "{priority}"
    purpose: Groups alert routing and operational handling by priority.
  endpoint:
    expression: "{chain}:{network}:{rpc_endpoint_id}"
    purpose: Groups node health by chain endpoint.

dead_letter_policy:
  topic: chain.events.dead_letter
  retry_topics: []
  max_delivery_attempts: 3
  classify_errors:
    schema_validation_failed: dead_letter
    decode_failed: dead_letter
    missing_required_field: dead_letter
    unsupported_schema_version: dead_letter
    transient_broker_error: retry_by_producer
  required_context:
    - original_topic
    - original_partition
    - original_offset
    - error_class
    - error_message
    - failed_at

topics:
  - name: chain.events.raw
    purpose: Raw normalized blockchain events emitted by chain adapters before priority routing.
    payload_contract: telemetry.fabric.platform.v1.Envelope
    payload_event_types:
      - blockchain.chain_event.transfer
      - blockchain.chain_event.log
      - blockchain.chain_event.transaction
    priority: mixed
    partition_count: 48
    partition_key:
      strategy: chain_block
      fields:
        - payload.chain
        - payload.network
        - payload.block_number
    retention:
      policy: delete
      period: 14d
      bytes: -1
      rationale: Raw adapter output is replayable from chain RPC and S3 snapshots, but needs enough broker history for short backfills.
    schema_compatibility: backward
    replay:
      role: primary_stream
      from_offset_allowed: true
      from_checkpoint_allowed: true

  - name: chain.events.critical
    purpose: Critical blockchain events that need low-latency processing and alerting.
    payload_contract: telemetry.fabric.platform.v1.Envelope
    payload_event_types:
      - blockchain.chain_event.transfer
      - blockchain.chain_event.log
    priority: CRITICAL
    partition_count: 24
    partition_key:
      strategy: priority
      fields:
        - priority
    retention:
      policy: delete
      period: 30d
      bytes: -1
      rationale: Critical events are operationally important and need longer replay windows for incident review.
    schema_compatibility: backward
    replay:
      role: priority_route
      source_topic: chain.events.raw

  - name: chain.events.important
    purpose: Important normalized events for near-real-time consumers and downstream enrichment.
    payload_contract: telemetry.fabric.platform.v1.Envelope
    payload_event_types:
      - blockchain.chain_event.transfer
      - blockchain.chain_event.log
    priority: IMPORTANT
    partition_count: 48
    partition_key:
      strategy: chain_block
      fields:
        - payload.chain
        - payload.network
        - payload.block_number
    retention:
      policy: delete
      period: 14d
      bytes: -1
      rationale: Matches the raw stream replay window while separating important traffic from aggregate traffic.
    schema_compatibility: backward
    replay:
      role: priority_route
      source_topic: chain.events.raw

  - name: chain.events.aggregate
    purpose: Lower-priority events intended for aggregation, metrics, and batch-style stream processing.
    payload_contract: telemetry.fabric.platform.v1.Envelope
    payload_event_types:
      - blockchain.chain_event.transfer
      - blockchain.chain_event.log
    priority: AGGREGATE
    partition_count: 24
    partition_key:
      strategy: address
      fields:
        - payload.from_address
        - payload.to_address
        - payload.contract_address
    retention:
      policy: delete
      period: 7d
      bytes: -1
      rationale: Aggregate traffic is reproducible and should not consume broker storage longer than needed for stream jobs.
    schema_compatibility: backward
    replay:
      role: priority_route
      source_topic: chain.events.raw

  - name: chain.events.dead_letter
    purpose: Failed blockchain events that could not be decoded, validated, or delivered safely.
    payload_contract: telemetry.fabric.platform.v1.Envelope
    payload_event_types:
      - blockchain.dead_letter
    priority: CRITICAL
    partition_count: 12
    partition_key:
      strategy: chain_block
      fields:
        - payload.chain
        - payload.network
        - payload.block_number
    retention:
      policy: delete
      period: 30d
      bytes: -1
      rationale: DLQ events need enough time for operator triage, repair, and replay.
    schema_compatibility: backward
    replay:
      role: repair_stream
      from_offset_allowed: true
      requires_manual_approval: true

  - name: chain.alerts
    purpose: Alert events produced by stream processors or rule evaluators.
    payload_contract: telemetry.fabric.platform.v1.Envelope
    payload_event_types:
      - blockchain.alert
    priority: CRITICAL
    partition_count: 12
    partition_key:
      strategy: priority
      fields:
        - priority
        - payload.rule_id
    retention:
      policy: delete
      period: 90d
      bytes: -1
      rationale: Alert streams need long incident and audit review windows.
    schema_compatibility: backward
    replay:
      role: derived_stream
      source_topic: chain.events.raw

  - name: chain.reorgs
    purpose: Reorg detection events used to invalidate or repair previously emitted chain events.
    payload_contract: telemetry.fabric.platform.v1.Envelope
    payload_event_types:
      - blockchain.reorg
    priority: CRITICAL
    partition_count: 12
    partition_key:
      strategy: chain_block
      fields:
        - payload.chain
        - payload.network
        - payload.common_ancestor_number
    retention:
      policy: compact,delete
      period: 90d
      bytes: -1
      rationale: Reorg records are rare but important for repair; compaction keeps the latest state per reorg key.
    schema_compatibility: backward
    replay:
      role: repair_signal
      consumers_must_be_idempotent: true

  - name: chain.node_health
    purpose: RPC endpoint and node health observations from crawler health checks.
    payload_contract: telemetry.fabric.platform.v1.Envelope
    payload_event_types:
      - blockchain.node_health
    priority: IMPORTANT
    partition_count: 12
    partition_key:
      strategy: endpoint
      fields:
        - payload.chain
        - payload.network
        - payload.rpc_endpoint_id
    retention:
      policy: compact,delete
      period: 30d
      bytes: -1
      rationale: Operators need recent health history while compaction preserves latest endpoint status.
    schema_compatibility: backward
    replay:
      role: operational_stream
      from_offset_allowed: true
