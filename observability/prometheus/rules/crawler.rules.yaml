groups:
  - name: telemetry-fabric.crawler
    interval: 30s
    rules:
      - record: crawler:lag_blocks:max
        expr: max by (chain, network, crawler) (crawler_lag_blocks)

      - record: crawler:lag_seconds:max
        expr: max by (chain, network, crawler) (crawler_lag_seconds)

      - record: crawler:height_gap:blocks
        expr: max by (chain, network, crawler) (crawler_chain_head_height) - max by (chain, network, crawler) (crawler_processed_height)

      - record: crawler:events_rate:5m
        expr: sum by (chain, network, crawler) (rate(crawler_discarded_events_total[5m])) + sum by (chain, network, crawler) (rate(crawler_kept_events_total[5m]))

      - record: crawler:discard_ratio:5m
        expr: sum by (chain, network, crawler) (rate(crawler_discarded_events_total[5m])) / clamp_min(crawler:events_rate:5m, 1)

      - record: crawler:ws_reconnect_rate:5m
        expr: sum by (chain, network, crawler, endpoint) (rate(crawler_ws_reconnect_total[5m]))

      - alert: ChainLagTooHigh
        expr: crawler:lag_blocks:max > 500 or crawler:lag_seconds:max > 900
        for: 10m
        labels:
          severity: warning
          service: crawler
        annotations:
          summary: "Crawler chain lag is too high"
          description: "Crawler {{ $labels.crawler }} on {{ $labels.chain }}/{{ $labels.network }} has excessive block or time lag."
          runbook_url: "https://runbooks.example.com/telemetry-fabric/crawler-chain-lag"

      - alert: CrawlerWorkerDown
        expr: min by (chain, network, crawler, instance) (crawler_worker_up) == 0 or up{job=~".*crawler.*"} == 0
        for: 2m
        labels:
          severity: critical
          service: crawler
        annotations:
          summary: "Crawler worker is down"
          description: "Crawler worker {{ $labels.instance }} is not reporting healthy scrape or worker status."
          runbook_url: "https://runbooks.example.com/telemetry-fabric/crawler-worker-down"

      - alert: QueueDepthHigh
        expr: max by (chain, network, crawler, queue) (crawler_queue_depth) > 10000
        for: 10m
        labels:
          severity: warning
          service: crawler
        annotations:
          summary: "Crawler queue depth is high"
          description: "Queue {{ $labels.queue }} for crawler {{ $labels.crawler }} is above the expected operating range."
          runbook_url: "https://runbooks.example.com/telemetry-fabric/crawler-queue-depth"

      - alert: DiscardRatioAbnormal
        expr: crawler:discard_ratio:5m > 0.8 and on (chain, network, crawler) crawler:events_rate:5m > 1
        for: 15m
        labels:
          severity: warning
          service: crawler
        annotations:
          summary: "Crawler discard ratio is abnormal"
          description: "Discarded event ratio for {{ $labels.crawler }} on {{ $labels.chain }}/{{ $labels.network }} is above 80% for non-trivial traffic."
          runbook_url: "https://runbooks.example.com/telemetry-fabric/discard-ratio"
