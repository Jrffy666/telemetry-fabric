syntax = "proto3";

package telemetry.fabric.blockchain.v1;

import "google/protobuf/timestamp.proto";

enum TokenStandard {
  TOKEN_STANDARD_UNSPECIFIED = 0;
  TOKEN_STANDARD_NATIVE = 1;
  TOKEN_STANDARD_ERC20 = 2;
  TOKEN_STANDARD_ERC721 = 3;
  TOKEN_STANDARD_ERC1155 = 4;
  TOKEN_STANDARD_SPL = 5;
  TOKEN_STANDARD_TRC20 = 6;
}

enum FinalityStatus {
  FINALITY_STATUS_UNSPECIFIED = 0;
  FINALITY_STATUS_PENDING = 1;
  FINALITY_STATUS_ACCEPTED = 2;
  FINALITY_STATUS_CONFIRMED = 3;
  FINALITY_STATUS_FINALIZED = 4;
  FINALITY_STATUS_REORGED = 5;
}

// ChainEvent is the normalized blockchain event payload emitted by adapters.
// Decimal and raw numeric token values are strings to avoid precision loss in
// JSON and languages without native fixed-precision decimal support.
message ChainEvent {
  string chain = 1;
  string network = 2;
  uint64 chain_id = 3;
  uint64 block_number = 4;
  string block_hash = 5;
  google.protobuf.Timestamp block_timestamp = 6;
  string tx_hash = 7;
  uint32 tx_index = 8;
  uint32 log_index = 9;
  string event_type = 10;
  string from_address = 11;
  string to_address = 12;
  string contract_address = 13;
  string token_address = 14;
  string token_symbol = 15;
  TokenStandard token_standard = 16;
  string amount_raw = 17;
  string amount_decimal = 18;
  string amount_usd = 19;
  uint64 gas_used = 20;
  string gas_price = 21;
  bool success = 22;
  FinalityStatus finality_status = 23;
  uint32 confirmations = 24;
  string source_rpc = 25;
  bool reorged = 26;
}
