syntax = "proto3";

package telemetry.fabric.blockchain.v1;

import "google/protobuf/timestamp.proto";

message ReorgedBlock {
  uint64 block_number = 1;
  string block_hash = 2;
  google.protobuf.Timestamp block_timestamp = 3;
}

message ReorgEvent {
  string chain = 1;
  string network = 2;
  uint64 chain_id = 3;
  uint64 depth = 4;
  uint64 old_head_number = 5;
  string old_head_hash = 6;
  uint64 new_head_number = 7;
  string new_head_hash = 8;
  uint64 common_ancestor_number = 9;
  string common_ancestor_hash = 10;
  repeated ReorgedBlock removed_blocks = 11;
  repeated ReorgedBlock added_blocks = 12;
  google.protobuf.Timestamp detected_at = 13;
  string source_rpc = 14;
  map<string, string> attributes = 15;
}
