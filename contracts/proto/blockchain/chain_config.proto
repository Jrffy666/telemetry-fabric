syntax = "proto3";

package telemetry.fabric.blockchain.v1;

import "blockchain/filter_rule.proto";

message RpcEndpointConfig {
  string endpoint_id = 1;
  string url = 2;
  string provider = 3;
  bool enabled = 4;
  uint32 priority = 5;
  uint32 timeout_ms = 6;
  uint32 max_retries = 7;
  uint32 rate_limit_per_second = 8;
  string auth_ref = 9;
  map<string, string> labels = 10;
}

message AdapterConfig {
  string adapter_id = 1;
  string implementation = 2;
  string version = 3;
  uint32 poll_interval_ms = 4;
  uint32 batch_size = 5;
  bool websocket_enabled = 6;
  bool backfill_enabled = 7;
  map<string, string> settings = 8;
}

message ChainConfig {
  string chain = 1;
  string network = 2;
  uint64 chain_id = 3;
  bool enabled = 4;
  repeated RpcEndpointConfig rpc_endpoints = 5;
  AdapterConfig adapter = 6;
  uint32 required_confirmations = 7;
  uint32 reorg_depth = 8;
  uint64 start_block = 9;
  repeated FilterRule filter_rules = 10;
  map<string, string> attributes = 11;
}
