global:
  scrape_interval: 30s

scrape_configs:
  - job_name: control-plane
    metrics_path: /metrics
    static_configs:
      - targets:
          - control-plane:4001

  - job_name: telemetry-agent
    metrics_path: /metrics
    static_configs:
      - targets:
          - telemetry-agent:13133
