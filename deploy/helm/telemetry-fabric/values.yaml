image:
  repository: telemetry-fabric/agent
  tag: "0.1.0"
  pullPolicy: IfNotPresent

agent:
  otlpGrpcAddress: "0.0.0.0:4317"
  healthAddress: "0.0.0.0:13133"
  otlpExportEndpoint: ""
  controlEndpoint: ""
  controlHeartbeatIntervalMs: 5000
  agentIdFromPodName: true
  queueDir: "/var/lib/telemetry-fabric/queue"
  tenant: "default"

controlPlane:
  enabled: false
  image:
    repository: telemetry-fabric/control-plane
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  replicas: 1
  httpListen: "0.0.0.0:4001"
  dataDir: "/var/lib/telemetry-fabric/control-plane"
  postgresSync: "true"
  postgresSyncIntervalMs: 5000
  databaseUrlSecret:
    name: ""
    key: database-url
  service:
    type: ClusterIP
    port: 4001
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

service:
  type: ClusterIP
  port: 4317
  healthPort: 13133

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
