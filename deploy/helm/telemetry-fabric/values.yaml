image:
  repository: telemetry-fabric/agent
  tag: "0.1.0"
  pullPolicy: IfNotPresent

productionMode: false

imagePullSecrets: []

agent:
  otlpGrpcAddress: "0.0.0.0:4317"
  healthAddress: "0.0.0.0:13133"
  otlpExportEndpoint: ""
  controlEndpoint: ""
  controlHeartbeatIntervalMs: 5000
  shutdownDrainTimeoutMs: 30000
  terminationGracePeriodSeconds: 35
  lifecycle:
    preStopSleepSeconds: 5
  probes:
    liveness:
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
    readiness:
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
    startup:
      enabled: true
      initialDelaySeconds: 0
      periodSeconds: 5
      timeoutSeconds: 2
      failureThreshold: 24
  agentIdFromPodName: true
  queueDir: "/var/lib/telemetry-fabric/queue"
  queueHostPath: "/var/lib/telemetry-fabric"
  tenant: "default"
  config:
    inline: ""
    existingConfigMap: ""
    key: pipeline.yaml
    mountPath: /etc/telemetry-fabric/agent
  extraArgs: []
  extraEnv: []
  extraEnvFrom: []
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  priorityClassName: ""
  updateStrategy: {}
  controlAuthTokenSecret:
    name: ""
    key: token
  controlTlsSecret:
    name: ""
    mountPath: /etc/telemetry-fabric/control-tls
    caKey: ca.crt
    certKey: tls.crt
    keyKey: tls.key
    serverName: ""
  serviceAccount:
    create: true
    name: ""
    annotations: {}
    automountServiceAccountToken: false
  podSecurityContext:
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    capabilities:
      drop:
        - ALL

controlPlane:
  enabled: false
  storage: "otp"
  image:
    repository: telemetry-fabric/control-plane
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  replicas: 1
  httpListen: "0.0.0.0:4001"
  dataDir: "/var/lib/telemetry-fabric/control-plane"
  postgresSync: "true"
  postgresSyncIntervalMs: 5000
  terminationGracePeriodSeconds: 30
  lifecycle:
    preStopSleepSeconds: 5
  probes:
    liveness:
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
    readiness:
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
    startup:
      enabled: true
      initialDelaySeconds: 0
      periodSeconds: 5
      timeoutSeconds: 2
      failureThreshold: 24
  extraEnv: []
  extraEnvFrom: []
  config:
    create: false
    name: ""
    data: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  priorityClassName: ""
  strategy: {}
  hpa:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts: []
    tls: []
  databaseUrlSecret:
    name: ""
    key: database-url
  auth:
    agentTokenSecret:
      name: ""
      key: token
    operatorTokenSecret:
      name: ""
      key: token
  tls:
    enabled: false
    secretName: ""
    mountPath: /etc/telemetry-fabric/control-plane-tls
    certKey: tls.crt
    keyKey: tls.key
    caKey: ca.crt
    requireClientAuth: false
  service:
    type: ClusterIP
    port: 4001
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""
  serviceAccount:
    create: true
    name: ""
    annotations: {}
    automountServiceAccountToken: false
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  podSecurityContext:
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    capabilities:
      drop:
        - ALL

service:
  type: ClusterIP
  port: 4317
  healthPort: 13133

networkPolicy:
  enabled: false

serviceMonitor:
  enabled: false
  namespace: ""
  interval: 30s
  labels: {}

prometheusRule:
  enabled: false
  namespace: ""
  labels: {}
  agent:
    queueBytesHigh:
      threshold: "1073741824"
      for: 10m
    flushFailures:
      window: 5m
      threshold: 0
      for: 5m
    controlHeartbeatFailures:
      window: 5m
      threshold: 0
      for: 5m
  controlPlane:
    http5xx:
      window: 5m
      threshold: 0
      for: 5m

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

observability:
  prometheus:
    enabled: false
    image:
      repository: prom/prometheus
      tag: "v2.55.1"
      pullPolicy: IfNotPresent
    replicas: 1
    retention: 15d
    storageSize: 20Gi
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 2Gi
  grafana:
    enabled: false
    image:
      repository: grafana/grafana
      tag: "11.4.0"
      pullPolicy: IfNotPresent
    replicas: 1
    adminSecret:
      name: ""
      key: admin-password
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
