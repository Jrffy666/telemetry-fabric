image:
  repository: telemetry-fabric/agent
  tag: "0.1.0"
  pullPolicy: IfNotPresent

agent:
  otlpGrpcAddress: "0.0.0.0:4317"
  healthAddress: "0.0.0.0:13133"
  otlpExportEndpoint: ""
  controlEndpoint: ""
  controlHeartbeatIntervalMs: 5000
  agentIdFromPodName: true
  queueDir: "/var/lib/telemetry-fabric/queue"
  tenant: "default"
  controlAuthTokenSecret:
    name: ""
    key: token
  controlTlsSecret:
    name: ""
    mountPath: /etc/telemetry-fabric/control-tls
    caKey: ca.crt
    certKey: tls.crt
    keyKey: tls.key
    serverName: ""
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  podSecurityContext:
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    capabilities:
      drop:
        - ALL

controlPlane:
  enabled: false
  storage: "otp"
  image:
    repository: telemetry-fabric/control-plane
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  replicas: 1
  httpListen: "0.0.0.0:4001"
  dataDir: "/var/lib/telemetry-fabric/control-plane"
  postgresSync: "true"
  postgresSyncIntervalMs: 5000
  databaseUrlSecret:
    name: ""
    key: database-url
  auth:
    agentTokenSecret:
      name: ""
      key: token
    operatorTokenSecret:
      name: ""
      key: token
  tls:
    enabled: false
    secretName: ""
    mountPath: /etc/telemetry-fabric/control-plane-tls
    certKey: tls.crt
    keyKey: tls.key
    caKey: ca.crt
    requireClientAuth: false
  service:
    type: ClusterIP
    port: 4001
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  podSecurityContext:
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    capabilities:
      drop:
        - ALL

service:
  type: ClusterIP
  port: 4317
  healthPort: 13133

networkPolicy:
  enabled: false

serviceMonitor:
  enabled: false
  namespace: ""
  interval: 30s
  labels: {}

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
