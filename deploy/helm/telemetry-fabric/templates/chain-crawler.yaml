{{- if .Values.crawler.enabled }}
{{- $name := include "telemetry-fabric.crawlerName" . -}}
{{- $labels := include "telemetry-fabric.componentLabels" (dict "root" . "name" $name "component" "chain-crawler") -}}
{{- if .Values.crawler.configMap.create }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ default (printf "%s-config" $name) .Values.crawler.configMap.name }}
  labels:
    {{- $labels | nindent 4 }}
data:
  {{- toYaml .Values.crawler.configMap.data | nindent 2 }}
---
{{- end }}
{{- if .Values.crawler.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ default (printf "%s-secrets" $name) .Values.crawler.secrets.name }}
  labels:
    {{- $labels | nindent 4 }}
type: Opaque
stringData:
  {{- toYaml .Values.crawler.secrets.stringData | nindent 2 }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- $labels | nindent 4 }}
spec:
  replicas: {{ .Values.crawler.replicas }}
  {{- with .Values.crawler.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- $labels | nindent 8 }}
      {{- if or .Values.crawler.podAnnotations .Values.crawler.configMap.create }}
      annotations:
        {{- with .Values.crawler.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.crawler.configMap.create }}
        checksum/config: {{ toYaml .Values.crawler.configMap.data | sha256sum | quote }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "telemetry-fabric.crawlerServiceAccountName" . }}
      automountServiceAccountToken: {{ .Values.crawler.serviceAccount.automountServiceAccountToken }}
      terminationGracePeriodSeconds: {{ .Values.crawler.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.crawler.priorityClassName }}
      priorityClassName: {{ .Values.crawler.priorityClassName | quote }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.crawler.podSecurityContext | nindent 8 }}
      {{- with .Values.crawler.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.crawler.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.crawler.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: chain-crawler
          image: "{{ .Values.crawler.image.repository }}:{{ .Values.crawler.image.tag }}"
          imagePullPolicy: {{ .Values.crawler.image.pullPolicy }}
          {{- with .Values.crawler.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.crawler.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.crawler.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or .Values.crawler.extraEnvFrom .Values.crawler.secrets.create }}
          envFrom:
            {{- if .Values.crawler.secrets.create }}
            - secretRef:
                name: {{ default (printf "%s-secrets" $name) .Values.crawler.secrets.name }}
            {{- end }}
            {{- with .Values.crawler.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.crawler.service.port }}
            - name: metrics
              containerPort: {{ .Values.crawler.service.metricsPort }}
          {{- if gt (int .Values.crawler.lifecycle.preStopSleepSeconds) 0 }}
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - "sleep {{ .Values.crawler.lifecycle.preStopSleepSeconds }}"
          {{- end }}
          livenessProbe:
            httpGet:
              path: {{ .Values.crawler.probes.liveness.path | quote }}
              port: {{ .Values.crawler.probes.liveness.port }}
            initialDelaySeconds: {{ .Values.crawler.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.crawler.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.crawler.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.crawler.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.crawler.probes.readiness.path | quote }}
              port: {{ .Values.crawler.probes.readiness.port }}
            initialDelaySeconds: {{ .Values.crawler.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.crawler.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.crawler.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.crawler.probes.readiness.failureThreshold }}
          {{- if .Values.crawler.probes.startup.enabled }}
          startupProbe:
            httpGet:
              path: {{ .Values.crawler.probes.startup.path | quote }}
              port: {{ .Values.crawler.probes.startup.port }}
            initialDelaySeconds: {{ .Values.crawler.probes.startup.initialDelaySeconds }}
            periodSeconds: {{ .Values.crawler.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.crawler.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.crawler.probes.startup.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.crawler.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.crawler.securityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.crawler.configMap.create }}
            - name: config
              mountPath: {{ .Values.crawler.configMap.mountPath | quote }}
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.crawler.configMap.create }}
        - name: config
          configMap:
            name: {{ default (printf "%s-config" $name) .Values.crawler.configMap.name }}
        {{- end }}
{{- if .Values.crawler.service.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- $labels | nindent 4 }}
spec:
  type: {{ .Values.crawler.service.type }}
  selector:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.crawler.service.port }}
      targetPort: http
    - name: metrics
      port: {{ .Values.crawler.service.metricsPort }}
      targetPort: metrics
{{- end }}
{{- end }}
