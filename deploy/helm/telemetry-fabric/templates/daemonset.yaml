apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "telemetry-fabric.name" . }}
  labels:
    {{- include "telemetry-fabric.labels" . | nindent 4 }}
spec:
  {{- with .Values.agent.updateStrategy }}
  updateStrategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "telemetry-fabric.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "telemetry-fabric.labels" . | nindent 8 }}
      {{- if or .Values.agent.podAnnotations .Values.agent.config.inline }}
      annotations:
        {{- with .Values.agent.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.agent.config.inline }}
        checksum/agent-config: {{ .Values.agent.config.inline | sha256sum | quote }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "telemetry-fabric.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.agent.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.agent.priorityClassName }}
      priorityClassName: {{ .Values.agent.priorityClassName | quote }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.agent.podSecurityContext | nindent 8 }}
      {{- with .Values.agent.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agent.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agent.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: agent
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            {{- if or .Values.agent.config.inline .Values.agent.config.existingConfigMap }}
            - "--config"
            - "{{ .Values.agent.config.mountPath }}/{{ .Values.agent.config.key }}"
            {{- else }}
            - "--tenant"
            - {{ .Values.agent.tenant | quote }}
            - "--otlp-grpc"
            - {{ .Values.agent.otlpGrpcAddress | quote }}
            {{- end }}
            - "--health-listen"
            - {{ .Values.agent.healthAddress | quote }}
            {{- if .Values.agent.otlpExportEndpoint }}
            - "--otlp-export-endpoint"
            - {{ .Values.agent.otlpExportEndpoint | quote }}
            {{- end }}
            {{- if .Values.agent.controlEndpoint }}
            - "--control-endpoint"
            - {{ .Values.agent.controlEndpoint | quote }}
            - "--control-heartbeat-interval-ms"
            - {{ .Values.agent.controlHeartbeatIntervalMs | quote }}
            {{- if .Values.agent.agentIdFromPodName }}
            - "--agent-id"
            - "$(POD_NAME)"
            {{- end }}
            {{- else if .Values.controlPlane.enabled }}
            - "--control-endpoint"
            - "{{ ternary "https" "http" .Values.controlPlane.tls.enabled }}://{{ include "telemetry-fabric.controlPlaneName" . }}:{{ .Values.controlPlane.service.port }}"
            - "--control-heartbeat-interval-ms"
            - {{ .Values.agent.controlHeartbeatIntervalMs | quote }}
            {{- if .Values.agent.agentIdFromPodName }}
            - "--agent-id"
            - "$(POD_NAME)"
            {{- end }}
            {{- end }}
            - "--queue-dir"
            - {{ .Values.agent.queueDir | quote }}
            - "--shutdown-drain-timeout-ms"
            - {{ .Values.agent.shutdownDrainTimeoutMs | quote }}
            {{- with .Values.agent.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- with .Values.agent.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if .Values.agent.controlAuthTokenSecret.name }}
            - name: TELEMETRY_FABRIC_CONTROL_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.agent.controlAuthTokenSecret.name | quote }}
                  key: {{ .Values.agent.controlAuthTokenSecret.key | quote }}
            {{- end }}
            {{- if .Values.agent.controlTlsSecret.name }}
            - name: TELEMETRY_FABRIC_CONTROL_CA_FILE
              value: "{{ .Values.agent.controlTlsSecret.mountPath }}/{{ .Values.agent.controlTlsSecret.caKey }}"
            - name: TELEMETRY_FABRIC_CONTROL_CERT_FILE
              value: "{{ .Values.agent.controlTlsSecret.mountPath }}/{{ .Values.agent.controlTlsSecret.certKey }}"
            - name: TELEMETRY_FABRIC_CONTROL_KEY_FILE
              value: "{{ .Values.agent.controlTlsSecret.mountPath }}/{{ .Values.agent.controlTlsSecret.keyKey }}"
            {{- if .Values.agent.controlTlsSecret.serverName }}
            - name: TELEMETRY_FABRIC_CONTROL_SERVER_NAME
              value: {{ .Values.agent.controlTlsSecret.serverName | quote }}
            {{- end }}
            {{- end }}
          ports:
            - name: otlp-grpc
              containerPort: {{ .Values.service.port }}
            - name: health
              containerPort: {{ .Values.service.healthPort }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.agent.securityContext | nindent 12 }}
          volumeMounts:
            - name: queue
              mountPath: /var/lib/telemetry-fabric
            - name: tmp
              mountPath: /tmp
            {{- if or .Values.agent.config.inline .Values.agent.config.existingConfigMap }}
            - name: agent-config
              mountPath: {{ .Values.agent.config.mountPath | quote }}
              readOnly: true
            {{- end }}
            {{- if .Values.agent.controlTlsSecret.name }}
            - name: control-tls
              mountPath: {{ .Values.agent.controlTlsSecret.mountPath | quote }}
              readOnly: true
            {{- end }}
      volumes:
        - name: queue
          hostPath:
            path: {{ .Values.agent.queueHostPath | quote }}
            type: DirectoryOrCreate
        - name: tmp
          emptyDir: {}
        {{- if or .Values.agent.config.inline .Values.agent.config.existingConfigMap }}
        - name: agent-config
          configMap:
            name: {{ default (include "telemetry-fabric.agentConfigMapName" .) .Values.agent.config.existingConfigMap | quote }}
        {{- end }}
        {{- if .Values.agent.controlTlsSecret.name }}
        - name: control-tls
          secret:
            secretName: {{ .Values.agent.controlTlsSecret.name | quote }}
        {{- end }}
