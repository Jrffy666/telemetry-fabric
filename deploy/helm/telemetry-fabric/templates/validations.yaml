{{- $storage := default "otp" .Values.controlPlane.storage -}}
{{- $agentImageTag := default "" .Values.image.tag | toString -}}
{{- $controlPlaneImageTag := default "" .Values.controlPlane.image.tag | toString -}}
{{- if .Values.productionMode -}}
{{- if not .Values.controlPlane.enabled -}}
{{- fail "productionMode=true requires controlPlane.enabled=true" -}}
{{- end -}}
{{- if ne $storage "postgres" -}}
{{- fail "productionMode=true requires controlPlane.storage=postgres" -}}
{{- end -}}
{{- if not .Values.controlPlane.databaseUrlSecret.name -}}
{{- fail "productionMode=true requires controlPlane.databaseUrlSecret.name" -}}
{{- end -}}
{{- if not .Values.agent.controlAuthTokenSecret.name -}}
{{- fail "productionMode=true requires agent.controlAuthTokenSecret.name" -}}
{{- end -}}
{{- if not .Values.controlPlane.auth.agentTokenSecret.name -}}
{{- fail "productionMode=true requires controlPlane.auth.agentTokenSecret.name" -}}
{{- end -}}
{{- if not .Values.controlPlane.auth.operatorTokenSecret.name -}}
{{- fail "productionMode=true requires controlPlane.auth.operatorTokenSecret.name" -}}
{{- end -}}
{{- if not .Values.controlPlane.tls.enabled -}}
{{- fail "productionMode=true requires controlPlane.tls.enabled=true" -}}
{{- end -}}
{{- if not .Values.controlPlane.tls.secretName -}}
{{- fail "productionMode=true requires controlPlane.tls.secretName" -}}
{{- end -}}
{{- if not .Values.networkPolicy.enabled -}}
{{- fail "productionMode=true requires networkPolicy.enabled=true" -}}
{{- end -}}
{{- if or (eq $agentImageTag "") (eq (lower $agentImageTag) "latest") -}}
{{- fail "productionMode=true requires image.tag to be non-empty and not latest" -}}
{{- end -}}
{{- if or (eq $controlPlaneImageTag "") (eq (lower $controlPlaneImageTag) "latest") -}}
{{- fail "productionMode=true requires controlPlane.image.tag to be non-empty and not latest" -}}
{{- end -}}
{{- end -}}
{{- if .Values.controlPlane.enabled -}}
{{- if not (has $storage (list "otp" "postgres")) -}}
{{- fail "controlPlane.storage must be one of: otp, postgres" -}}
{{- end -}}
{{- if and (ne $storage "postgres") (gt (int .Values.controlPlane.replicas) 1) -}}
{{- fail "controlPlane.replicas > 1 requires controlPlane.storage=postgres; OTP/file-backed storage is single-writer only" -}}
{{- end -}}
{{- if and (ne $storage "postgres") .Values.controlPlane.hpa.enabled -}}
{{- fail "controlPlane.hpa.enabled=true requires controlPlane.storage=postgres; OTP/file-backed storage is single-writer only" -}}
{{- end -}}
{{- if and (eq $storage "postgres") (not .Values.controlPlane.databaseUrlSecret.name) -}}
{{- fail "controlPlane.storage=postgres requires controlPlane.databaseUrlSecret.name" -}}
{{- end -}}
{{- if and .Values.controlPlane.tls.enabled (not .Values.controlPlane.tls.secretName) -}}
{{- fail "controlPlane.tls.enabled=true requires controlPlane.tls.secretName" -}}
{{- end -}}
{{- if and .Values.controlPlane.tls.requireClientAuth (not .Values.controlPlane.tls.enabled) -}}
{{- fail "controlPlane.tls.requireClientAuth=true requires controlPlane.tls.enabled=true" -}}
{{- end -}}
{{- if and .Values.controlPlane.tls.requireClientAuth (not .Values.controlPlane.tls.secretName) -}}
{{- fail "controlPlane mTLS requires controlPlane.tls.secretName with ca.crt, tls.crt, and tls.key" -}}
{{- end -}}
{{- if and .Values.controlPlane.ingress.enabled (not .Values.controlPlane.ingress.hosts) -}}
{{- fail "controlPlane.ingress.enabled=true requires at least one controlPlane.ingress.hosts entry" -}}
{{- end -}}
{{- end -}}
