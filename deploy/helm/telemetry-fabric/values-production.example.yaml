image:
  repository: registry.example.com/telemetry-fabric/agent
  tag: "0.1.0"
  pullPolicy: IfNotPresent

productionMode: true

imagePullSecrets:
  - name: registry-pull-secret

agent:
  config:
    existingConfigMap: telemetry-fabric-agent-pipeline
    key: pipeline.yaml
  controlAuthTokenSecret:
    name: telemetry-fabric-agent-token
    key: token
  controlTlsSecret:
    name: telemetry-fabric-control-plane-tls
    caKey: ca.crt
    certKey: tls.crt
    keyKey: tls.key
  queueHostPath: /var/lib/telemetry-fabric
  shutdownDrainTimeoutMs: 30000
  terminationGracePeriodSeconds: 35
  lifecycle:
    preStopSleepSeconds: 10
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 10%
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: /metrics
    prometheus.io/port: "13133"
  tolerations:
    - operator: Exists
      effect: NoSchedule
  serviceAccount:
    automountServiceAccountToken: false

controlPlane:
  enabled: true
  storage: postgres
  image:
    repository: registry.example.com/telemetry-fabric/control-plane
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  replicas: 2
  databaseUrlSecret:
    name: telemetry-fabric-postgres
    key: database-url
  auth:
    agentTokenSecret:
      name: telemetry-fabric-agent-token
      key: token
    operatorTokenSecret:
      name: telemetry-fabric-operator-token
      key: token
  tls:
    enabled: true
    secretName: telemetry-fabric-control-plane-tls
    requireClientAuth: false
  persistence:
    enabled: false
    size: 10Gi
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: telemetry-fabric-control-plane
            topologyKey: kubernetes.io/hostname
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  ingress:
    enabled: false
    className: nginx
    annotations: {}
    hosts:
      - host: control-plane.example.com
        paths:
          - path: /
            pathType: Prefix
    tls: []
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

networkPolicy:
  enabled: true

serviceMonitor:
  enabled: true
  interval: 30s
  labels:
    release: prometheus

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi
