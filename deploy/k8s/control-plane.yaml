apiVersion: v1
kind: ServiceAccount
metadata:
  name: telemetry-fabric-control-plane
  namespace: observability
  labels:
    app.kubernetes.io/name: telemetry-fabric-control-plane
automountServiceAccountToken: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: telemetry-fabric-control-plane-data
  namespace: observability
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-fabric-control-plane
  namespace: observability
  labels:
    app.kubernetes.io/name: telemetry-fabric-control-plane
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: telemetry-fabric-control-plane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: telemetry-fabric-control-plane
    spec:
      serviceAccountName: telemetry-fabric-control-plane
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: control-plane
          image: telemetry-fabric/control-plane:0.1.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          env:
            - name: TELEMETRY_FABRIC_CONTROL_HTTP_LISTEN
              value: "0.0.0.0:4001"
            - name: TELEMETRY_FABRIC_CONTROL_DATA_DIR
              value: /var/lib/telemetry-fabric/control-plane
            - name: TELEMETRY_FABRIC_CONTROL_STORAGE
              value: "otp"
          ports:
            - name: http
              containerPort: 4001
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 24
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - sleep 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/telemetry-fabric/control-plane
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: telemetry-fabric-control-plane-data
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: telemetry-fabric-control-plane
  namespace: observability
  labels:
    app.kubernetes.io/name: telemetry-fabric-control-plane
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: telemetry-fabric-control-plane
  ports:
    - name: http
      port: 4001
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: telemetry-fabric-control-plane
  namespace: observability
  labels:
    app.kubernetes.io/name: telemetry-fabric-control-plane
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: telemetry-fabric-control-plane
