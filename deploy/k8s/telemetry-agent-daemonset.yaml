apiVersion: v1
kind: ServiceAccount
metadata:
  name: telemetry-fabric-agent
  namespace: observability
  labels:
    app.kubernetes.io/name: telemetry-fabric-agent
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: telemetry-fabric-agent
  namespace: observability
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: telemetry-fabric-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: telemetry-fabric-agent
    spec:
      serviceAccountName: telemetry-fabric-agent
      securityContext:
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: telemetry-fabric/agent:0.1.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          args:
            - "--tenant"
            - "default"
            - "--agent-id"
            - "$(POD_NAME)"
            - "--otlp-grpc"
            - "0.0.0.0:4317"
            - "--health-listen"
            - "0.0.0.0:13133"
            - "--control-endpoint"
            - "http://telemetry-fabric-control-plane:4001"
            - "--queue-dir"
            - "/var/lib/telemetry-fabric/queue"
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: health
              containerPort: 13133
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: queue
              mountPath: /var/lib/telemetry-fabric
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: queue
          hostPath:
            path: /var/lib/telemetry-fabric
            type: DirectoryOrCreate
        - name: tmp
          emptyDir: {}
