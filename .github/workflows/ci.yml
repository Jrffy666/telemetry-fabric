name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  elixir:
    name: Elixir
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: telemetry_fabric_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d telemetry_fabric_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/control_plane
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix test
      - run: mix telemetry_fabric.postgres.migrate --dry-run
      - run: mix test test/postgres_live_persistence_test.exs
        env:
          TELEMETRY_FABRIC_CONTROL_POSTGRES_INTEGRATION: "1"
          TELEMETRY_FABRIC_CONTROL_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/telemetry_fabric_test

  go:
    name: Go Crawler
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/chain-crawler-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/chain-crawler-go/go.mod
          cache-dependency-path: services/chain-crawler-go/go.mod
      - run: go test ./...

  python:
    name: Python Analytics
    runs-on: ubuntu-latest
    env:
      PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/analytics-python/pyproject.toml
      - run: '"$PYTHON" -m pip install --upgrade pip'
      - run: '"$PYTHON" -m pip install -e "./services/analytics-python[test]"'
      - run: make python-test

  compute-accelerator:
    name: C++ Compute Accelerator
    runs-on: ubuntu-latest
    env:
      CMAKE: cmake
      CTEST: ctest
    steps:
      - uses: actions/checkout@v4
      - run: make cpp-test CMAKE_BUILD_ARGS=--parallel

  deploy-assets:
    name: Deployment Assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f deploy/docker/docker-compose.yml config
      - run: docker build -f deploy/docker/telemetry-agent.Dockerfile -t telemetry-fabric/agent:ci .
      - run: docker build -f deploy/docker/control-plane.Dockerfile -t telemetry-fabric/control-plane:ci .
      - run: bash scripts/ci_smoke_compose.sh
        timeout-minutes: 8
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/telemetry-fabric
      - run: helm lint deploy/helm/telemetry-fabric -f deploy/helm/telemetry-fabric/values-production.example.yaml
      - run: helm template telemetry-fabric deploy/helm/telemetry-fabric --set controlPlane.enabled=true
      - run: helm template telemetry-fabric deploy/helm/telemetry-fabric -f deploy/helm/telemetry-fabric/values-production.example.yaml
      - run: |
          if helm template telemetry-fabric deploy/helm/telemetry-fabric --set controlPlane.enabled=true --set controlPlane.replicas=2; then
            echo "expected Helm validation to reject multi-replica OTP storage"
            exit 1
          fi
