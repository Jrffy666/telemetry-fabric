rule_version: blockchain-watchlists-example-v1
mode: shadow
default_classification: DROP
blacklist:
  addresses:
    - "0x000000000000000000000000000000000000dead"
  contracts:
    - "0x000000000000000000000000000000000000bad0"
  tokens:
    - "0x000000000000000000000000000000000000bad1"
watchlists:
  addresses:
    - address: "0x1111111111111111111111111111111111111111"
      label: "treasury"
      classification: IMPORTANT
    - address: "0x4444444444444444444444444444444444444444"
      label: "incident-response-wallet"
      classification: CRITICAL
  contracts:
    - address: "0x2222222222222222222222222222222222222222"
      label: "stablecoin-usdc"
      classification: IMPORTANT
  tokens:
    - address: "0x3333333333333333333333333333333333333333"
      symbol: "USDC"
      label: "usdc"
      min_usd: 100000
      classification: CRITICAL
