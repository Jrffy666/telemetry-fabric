rule_version: blockchain-large-transfer-v1
mode: enforce
default_classification: DROP
rules:
  - id: large_stablecoin_transfer
    description: "Large stablecoin transfers are critical because they should be saved and alerted."
    priority: 10
    classification: CRITICAL
    force_keep: true
    match:
      event_types: [token_transfer]
      token_symbols: [USDC, USDT, DAI]
      min_amount_usd: 1000000
  - id: medium_stablecoin_transfer
    description: "Medium stablecoin transfers are important and should be saved."
    priority: 20
    classification: IMPORTANT
    match:
      event_types: [token_transfer]
      token_symbols: [USDC, USDT, DAI]
      min_amount_usd: 100000
