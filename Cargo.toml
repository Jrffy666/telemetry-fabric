[workspace]
resolver = "2"
members = [
  "crates/telemetry-core",
  "crates/telemetry-module-sdk",
  "crates/telemetry-buffer",
  "crates/telemetry-otlp",
  "crates/telemetry-processors",
  "crates/telemetry-exporters",
  "crates/telemetry-agent",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Telemetry Fabric Contributors"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
