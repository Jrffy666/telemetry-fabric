# Example analytics configuration.
# Keep secrets in environment variables or a secret manager, not in notebooks.

clickhouse:
  host: localhost
  port: 8123
  username: default
  database: telemetry_fabric
  secure: false
  connect_timeout_seconds: 10
  send_receive_timeout_seconds: 60
  retry_attempts: 3
  retry_backoff_seconds: 0.5

kafka:
  bootstrap_servers: localhost:9092
  group_id: analytics-python
  topics:
    - blockchain.events.replay
  auto_offset_reset: earliest
  enable_auto_commit: false
  enable_auto_offset_store: false
  max_poll_records: 500
  poll_timeout_seconds: 1.0

s3:
  region: us-east-1
  default_row_limit: 100000
  batch_size: 10000

query_safety:
  default_limit: 10000
  max_limit: 1000000
  chunk_size: 10000
  max_result_rows: 1000000
  query_timeout_seconds: 60
  require_limit: true

output_dir: reports/out
