[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telemetry-fabric-analytics"
version = "0.1.0"
description = "Offline Python analytics layer for Telemetry Fabric blockchain data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "Telemetry Fabric" },
]
dependencies = [
  "pandas>=2.2",
  "polars>=0.20",
  "pyarrow>=15",
  "clickhouse-connect>=0.7",
  "confluent-kafka>=2.3",
  "PyYAML>=6.0",
  "scikit-learn>=1.4",
  "networkx>=3.2",
  "duckdb>=0.10",
]

[project.optional-dependencies]
viz = [
  "matplotlib>=3.8",
  "plotly>=5.20",
]
notebook = [
  "ipykernel>=6",
  "jupyterlab>=4",
]
test = [
  "pytest>=8",
  "pytest-cov>=5",
]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "jupyterlab>=4",
  "matplotlib>=3.8",
  "plotly>=5.20",
  "ruff>=0.5",
  "mypy>=1.10",
  "ipykernel>=6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["analytics*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_configs = true
