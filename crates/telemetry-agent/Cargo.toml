[package]
name = "telemetry-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "telemetry-agent"
path = "src/main.rs"

[dependencies]
opentelemetry-proto = { version = "0.32.0", default-features = false, features = ["gen-tonic", "trace", "metrics", "logs", "with-serde"] }
prost = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
telemetry-buffer = { path = "../telemetry-buffer" }
telemetry-core = { path = "../telemetry-core" }
telemetry-exporters = { path = "../telemetry-exporters" }
telemetry-otlp = { path = "../telemetry-otlp" }
telemetry-processors = { path = "../telemetry-processors" }
tokio = { version = "1.48.0", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tonic = { version = "0.14.6", features = ["transport"] }
webpki-roots = "1"

[lints]
workspace = true
