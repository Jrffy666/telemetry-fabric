[package]
name = "telemetry-exporters"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "telemetry_exporters"
path = "src/lib.rs"

[dependencies]
opentelemetry-proto = { version = "0.32.0", default-features = false, features = ["gen-tonic", "trace", "metrics", "logs", "with-serde"] }
prost = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
serde = "1.0"
serde_json = "1.0"
telemetry-core = { path = "../telemetry-core" }
tokio = { version = "1.48.0", features = ["io-util", "net"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tonic = { version = "0.14.6", features = ["transport"] }
webpki-roots = "1"

[dev-dependencies]
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "sync", "io-util", "net"] }
tokio-stream = { version = "0.1.18", features = ["net"] }

[lints]
workspace = true
